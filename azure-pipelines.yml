trigger:
  branches:
    include:
      - main   # Run pipeline on pushes to main branch

pool:
  name: 'PrivatePool'   # Your self-hosted agent pool

steps:
- script: |
    python --version
    pip --version
  displayName: 'Check Python & pip'

- script: |
    echo "Installing dependencies..."
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    echo "Running tests..."
    pytest
  displayName: 'Run tests'
